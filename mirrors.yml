# The mirrors this instance should have.
#
# Applied on every deploy by `buddy mirror:apply mirrors.yml`, from the
# pre-start step in `config/cloud.ts`. Additive: a mirror on the instance and
# not in this file is reported and left alone, so a partial file can never take
# a repository off the box. See `app/Actions/Mirror/declare.ts`.
#
#   buddy mirror:apply mirrors.yml --plan   # what would change, touching nothing
#   buddy mirror:apply mirrors.yml
#
# `remote` is the upstream as GitHub spells it. `owner` is the organization or
# user here. `name` defaults to the upstream's, and is only worth writing when
# the two differ.
#
# The hundred and fourteen mirrors added by hand before this file existed are
# not listed - `--plan` prints them under "not in this file" for whoever wants
# to finish the job.
mirrors:
  # The organization's profile page, which is the file GitHub renders at
  # github.com/stacksjs and this forge renders at reviewos.org/stacks. It is
  # the one repository nobody thought to add by hand, and its absence read as
  # an organization that had never written a profile.
  #
  # Code only. `profile/README.md` is the whole repository; there are no issues
  # to import and asking for them costs an API call a sweep.
  - remote: stacksjs/.github
    owner: stacks

  # Native Mac source acceptance uses this instance's repository-scoped runner.
  # The framework's .reviewos/workflows is authoritative; publication reads
  # public execution metadata and requires its exact commit and workflow hash.
  - remote: stacksjs/stacks
    owner: stacks
    ci: true
    interval: 60

  # HQ.training, whose CI runs here instead of on GitHub Actions: the
  # repository is private, so Actions bills it by the minute (~16 a push),
  # while its runner here is one flat-rate box that takes this repository's
  # jobs and nobody else's (`runner:local --register --repository`). The code
  # stays on GitHub; every sync that moves a ref runs `.reviewos/workflows`
  # and the verdict goes back to the commit as the status "ReviewOS / CI".
  #
  # Private here because it is private there, and read with its own
  # account credential, which can also read issues and pull requests. The repository's push webhook
  # starts CI at once; without it the sweep (every five minutes, this mirror
  # due every minute) starts it within five.
  - remote: stacksjs/hq.training
    owner: stacks
    credential: github_account
    metadata: true
    private: true
    ci: true
    interval: 60

  # LSU uses the same Stacks CI/deploy/native-release workflows on our runners.
  # Keep its code private and consume the account credential without embedding
  # it in a clone URL. The normal mirror sweep and push webhook own CI triggers.
  - remote: stacksjs/lastsoulultra
    owner: stacks
    credential: github_account
    private: true
    ci: true
    interval: 60

  # Postline, the social publishing tool. Its CI and its desktop release run
  # here instead of on GitHub Actions: `.reviewos/workflows/ci.yml` on the
  # instance's Linux runners, and `release.yml` on the project's own Mac
  # runner (`[self-hosted, macos-arm64, postline]`), which a `v*` tag starts.
  # Public upstream, so it needs no credential to read. `ci: true` is what
  # runs the workflows and posts "ReviewOS / CI" back to the commit.
  - remote: stacksjs/postline
    owner: stacks
    ci: true
    interval: 60

  # The Open Times, the publication platform Postline was split out of. It is
  # private upstream, so GitHub Actions bills it by the minute, and read with
  # the account credential like the other private mirrors.
  - remote: stacksjs/theopentimes.org
    owner: stacks
    credential: github_account
    private: true
    ci: true
    interval: 60

  # zig-anti-virus, whose CI runs here while GitHub Actions is disabled for the
  # repository upstream. Its workflows stay GitHub's (`.github/workflows`, read
  # as they stand, so they keep working there when Actions returns), and
  # `runners:` says what their GitHub-hosted labels mean here: the Linux jobs
  # run on the owned Linux executor this repository shares with HQ and LSU
  # (fleet.yml), and the labels no machine here answers for are skipped with
  # the reason instead of waiting forever. Priority -5 lets HQ's and LSU's
  # deploys go first; the starvation rule still runs these within half an hour.
  # One executor runs these jobs one after another, where GitHub gave every
  # push machines of its own, so `intermediate: skip` runs the newest commit
  # per branch: a run already started finishes, and the waiting ones a newer
  # commit replaces are dropped. `workflows:` keeps the nightly fuzz (27 jobs of
  # up to two hours) on GitHub; it and the prefilter benchmark can still be
  # started here by hand.
  # The account credential reports each workflow's verdict back to the commit
  # as "ReviewOS / CI" and "ReviewOS / Differential".
  - remote: zig-utils/zig-anti-virus
    owner: zig-utils
    credential: github_account
    ci: true
    interval: 60
    priority: -5
    intermediate: skip
    workflows:
      - .github/workflows/ci.yml
      - .github/workflows/differential.yml
    runners:
      ubuntu-latest: [self-hosted, lsu-linux]
      ubuntu-24.04: [self-hosted, lsu-linux]
      # No arm64 Linux, no Windows, and the one Mac executor keeps its disk for
      # HQ's native work: these run only on GitHub.
      ubuntu-24.04-arm: false
      macos-latest: false
      windows-latest: false

  # `ReviewOS/.github` is deliberately absent: there is no such repository
  # upstream, and a declared mirror of a repository that does not exist is a
  # sweep that fails every fifteen minutes until it disables itself. This
  # project's own profile page is written here rather than mirrored - the forge
  # reads `reviewos/.profile` first, which is the name it asks for.
