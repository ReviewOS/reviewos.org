<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 40" width="208" height="40" role="img" aria-label="ReviewOS">
  <title>ReviewOS</title>
  <!--
    The lockup: the mark, then the name, at the spacing the site nav already
    uses. One file rather than two, because a wordmark and its icon drifting
    apart is how a README ends up with last year's logo beside this year's.
    The icon alone is `/favicon.svg`, which is the same two bars in the same
    square.

    Drawn rather than set in a typeface so it renders identically wherever it is
    embedded - a README on another forge, a slide, a conference badge - none of
    which will have Geist installed.
  -->
  <rect width="40" height="40" rx="11" fill="#4ec5c9"/>
  <rect x="9" y="11" width="22" height="4.5" rx="2.25" fill="#08201f"/>
  <rect x="9" y="20" width="22" height="4.5" rx="2.25" fill="#08201f"/>
  <g fill="currentColor">
    <!-- R -->
    <path d="M56 10h9.6c4.7 0 7.6 2.5 7.6 6.6 0 2.9-1.5 5-4 6l4.6 7.4h-5l-4-6.6h-4v6.6H56V10zm9.2 9.4c2 0 3.2-1 3.2-2.7s-1.2-2.7-3.2-2.7h-4.4v5.4h4.4z"/>
    <!-- e -->
    <path d="M83.4 30.4c-4.6 0-7.7-3.1-7.7-7.8s3-7.9 7.5-7.9c4.4 0 7.3 3 7.3 7.6v1.2H80.2c.3 2.1 1.6 3.3 3.4 3.3 1.4 0 2.5-.6 3-1.7l4 1.2c-1.1 2.6-3.7 4.1-7.2 4.1zm-3.1-9.6h6.2c-.2-1.9-1.3-3-3-3s-2.9 1.1-3.2 3z"/>
    <!-- v -->
    <path d="M91.6 15.1h4.9l3.5 10 3.5-10h4.8L102 30h-5.1l-5.3-14.9z"/>
    <!-- i -->
    <path d="M109.4 15.1h4.6V30h-4.6V15.1zm-.2-5.4h5V14h-5V9.7z"/>
    <!-- e -->
    <path d="M124.3 30.4c-4.6 0-7.7-3.1-7.7-7.8s3-7.9 7.5-7.9c4.4 0 7.3 3 7.3 7.6v1.2h-10.3c.3 2.1 1.6 3.3 3.4 3.3 1.4 0 2.5-.6 3-1.7l4 1.2c-1.1 2.6-3.7 4.1-7.2 4.1zm-3.1-9.6h6.2c-.2-1.9-1.3-3-3-3s-2.9 1.1-3.2 3z"/>
    <!-- w -->
    <path d="M132.4 15.1h4.7l2.3 9.3 2.5-9.3h4.3l2.5 9.3 2.3-9.3h4.6L151.5 30h-4.7l-2.4-8.8-2.4 8.8h-4.7l-4.9-14.9z"/>
  </g>
  <!-- OS, in the mark's colour, because the product is the review surface and
       the OS is what it runs as. -->
  <g fill="#4ec5c9">
    <path d="M169.4 30.4c-6 0-10.3-4.3-10.3-10.4S163.4 9.6 169.4 9.6s10.3 4.3 10.3 10.4-4.3 10.4-10.3 10.4zm0-4.2c3.3 0 5.5-2.5 5.5-6.2s-2.2-6.2-5.5-6.2-5.5 2.5-5.5 6.2 2.2 6.2 5.5 6.2z"/>
    <path d="M190 30.4c-4.9 0-8-2.4-8.4-6.4l4.7-.7c.2 2 1.5 3.1 3.7 3.1 1.9 0 3.1-.8 3.1-2.1 0-1.1-.7-1.7-2.6-2.1l-3-.7c-3.6-.8-5.4-2.6-5.4-5.6 0-3.8 3.1-6.3 7.8-6.3 4.5 0 7.5 2.3 8 6l-4.6.8c-.3-1.8-1.6-2.8-3.5-2.8-1.8 0-2.9.8-2.9 2 0 1 .7 1.6 2.3 2l3.2.7c3.8.9 5.6 2.6 5.6 5.7 0 4-3.2 6.4-8 6.4z"/>
  </g>
</svg>
