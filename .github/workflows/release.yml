name: Releaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

# Publishing a workspace exposes packages one at a time. Keep tag releases
# serialized so a newer compatible version cannot enter npm resolution while
# the previous tag's clean-install smoke test is still running.
concurrency:
  group: stacks-framework-release
  cancel-in-progress: false

jobs:
  # Nothing stopped a publish before this job existed. `npm` triggers straight
  # off a `v*` tag push with no dependency on CI, and ci.yml does not even run
  # on tags, so releases went out while CI was red. The checks were never the
  # problem; having no consequence was.
  #
  # What it checks is the tree this app can actually check: lint, types, tests.
  # It used to run ten `protocol:*` and `docs:*` checks inherited from the
  # framework's own workflow, and every one of them failed here with `Command
  # "protocol:check" not found` - they are commands of the Stacks monorepo and
  # of the protocol repository, and an app that installs the framework from npm
  # has neither. So the gate blocked every release in this project for a reason
  # that had nothing to do with this project, while the things that would
  # actually make a release unsafe went unchecked. A gate that is always red is
  # a gate everybody learns to bypass.
  #
  # Re-run here against the tagged commit rather than trusting a CI verdict that
  # may be absent, cancelled, or for a different SHA. They cost about two minutes
  # against a release that does not start publishing for longer than that.
  #
  # Break-glass: set the repository variable RELEASE_GATE_BYPASS to 'true' to
  # ship while something unrelated is red. It is a variable rather than a code
  # change so it can be flipped and unflipped without a commit, and it leaves a
  # warning annotation on the run so the bypass is visible afterwards.
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        # Matches the npm job's install rather than CI's --frozen-lockfile, so
        # the gate validates exactly the tree the release will publish and
        # cannot block on a lockfile difference the release itself tolerates.
        run: bun install

      - name: Verify the tagged commit
        if: vars.RELEASE_GATE_BYPASS != 'true'
        # Both run even after one fails, so a release blocked by a lint error
        # and a type error reports both instead of hiding the second behind the
        # first. `::error::` surfaces each failure in the run summary.
        #
        # A name that is not a script in package.json fails the gate rather than
        # being skipped. Skipping is exactly how the previous version came to be
        # gating on ten commands that had never existed here: each one printed a
        # notice, nobody read the notices, and the gate quietly checked nothing
        # until the day it blocked everything.
        #
        # The test suite is not re-run here. It needs MySQL, DynamoDB and Redis
        # containers, and a second copy of that service definition is a second
        # thing to keep in step with ci.yml - which does run it, on the release
        # commit, because that commit lands on main. Lint and typecheck need no
        # infrastructure, take under two minutes, and catch the case this gate
        # exists for: a tag cut from a tree that does not build.
        run: |
          status=0
          for check in lint typecheck
          do
            echo "::group::$check"
            if ! bun -e "process.exit(JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.['$check'] ? 0 : 1)"; then
              echo "::error title=Release gate::$check is not a script in package.json, so the gate is asking for something that does not exist. Fix this workflow."
              status=1
            elif bun run "$check"; then
              echo "$check ok"
            else
              echo "::error title=Release gate::$check failed. Fix it and re-tag, or set RELEASE_GATE_BYPASS to ship anyway."
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Gate bypassed
        if: vars.RELEASE_GATE_BYPASS == 'true'
        run: echo "::warning title=Release gate bypassed::RELEASE_GATE_BYPASS is set, so the tagged commit was not verified for this release."
  # What a release of this project *is*.
  #
  # ReviewOS is an application, and `package.json` says `"private": true`. It
  # has nothing to publish to a registry. What replaced this job published the
  # Stacks framework: it looped over `storage/framework/core/*/`, built each
  # package, and ran `pantry publish --npm` against them - in a repository that
  # has no `storage/framework/core`, because it installs the framework from npm
  # like any other app. The loops matched nothing, the publish had nothing to
  # publish, and a `homebrew` job after it pushed a formula for a binary this
  # repository does not build.
  #
  # That is the whole shape of the problem this file had: it was the framework's
  # release pipeline, copied into an app, gated on the framework's conformance
  # checks. None of it could ever have run here.
  #
  # Deployment is not here either. ci.yml deploys on every push to main, and the
  # release commit lands on main, so production is already updated by the time
  # this runs. A tag is a marker and a changelog, and this job writes them.
  github-release:
    name: github release
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Full history: the changelog is generated from the commits since the
          # previous tag, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Read the changelog for this version
        id: changelog
        # `buddy release` already writes CHANGELOG.md and commits it, and the
        # tag points at that commit - so the notes are read out of the file
        # rather than re-derived from `git log`. Two generators over the same
        # history are two things that can disagree, and the one nobody reads is
        # always the one that is wrong.
        run: |
          version="${{ steps.version.outputs.version }}"

          notes=$(awk -v v="## $version" '
            $0 == v { grab = 1; next }
            grab && /^## v[0-9]/ { exit }
            grab { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning title=Changelog::No $version section in CHANGELOG.md; falling back to the commit list."
            previous=$(git describe --tags --abbrev=0 "$version^" 2>/dev/null || true)
            range="${previous:+$previous..}$version"
            notes=$(git log "$range" --no-merges --pretty=format:'- %s')
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --verify-tag
