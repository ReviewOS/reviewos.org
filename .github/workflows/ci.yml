name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    # A job that hangs holds the `ci-refs/heads/main` concurrency group, and
    # with `cancel-in-progress: false` on a push every later run then queues
    # behind it or is cancelled - so one stuck job stops deploying entirely.
    # That is not hypothetical: `typecheck` hung here for three and a half
    # hours on 2026-08-17 and took eleven pushes down with it, the same
    # framework bug `deploy.yml` already carries a timeout for. Without an
    # explicit value the ceiling is six hours.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # After the install: the bunfig preload resolves @stacksjs/env, so
      # anything invoking `bun` before node_modules exists dies with
      # `preload not found`. Only bites a project resolving the framework from
      # npm rather than a vendored storage/framework/core, but the ordering is
      # wrong either way.
      - name: Check lockfile version
        run: bun .github/scripts/check-lockfile-version.ts

      - name: Check dependency state
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun .github/scripts/check-dependency-commits.ts

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        # `tsc` directly, not `bun run typecheck`.
        #
        # They are the same check; the difference is that the wrapper does not
        # survive this runner. It hangs - a framework bug where a swallowed
        # exception leaves the process alive with nothing to end it - and the
        # job then sits until the 15-minute cap kills it. GitHub reports a
        # timed-out job as *cancelled*, which reads like somebody pushed over
        # it, so the run's other jobs all say success and the run says
        # cancelled and nothing points at this step.
        #
        # That is the entire reason `deploy` has been skipped on every push:
        # it needs typecheck, typecheck never finished, and the two greenest
        # legs in the matrix went green underneath it for nothing.
        #
        # `deploy.yml` moved to `tsc` for exactly this on 2026-08-19 and its
        # note says the rest: CI "gets away with the wrapper because it has the
        # Pantry toolchain and a warm node_modules cache". It does not, and a
        # check that only works with a warm cache is one that fails when it is
        # needed most. The two paths run the same command again.
        run: bun x --bun tsc --noEmit -p tsconfig.json --pretty false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Both engines, every time.
    #
    # Phase 17 moves the metadata database to MySQL, and a dialect that is only
    # exercised on the maintainer's laptop is a dialect that breaks on somebody
    # else's server. The two jobs run the same suite against the same code; what
    # differs is `DB_CONNECTION` and which migration corpus is applied.
    #
    # `fail-fast: false` on purpose: when one engine breaks, the useful question
    # is whether the other one did too, and cancelling the sibling job takes
    # that answer away.
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]

    name: test (${{ matrix.dialect }})

    services:
      mysql:
        image: mysql:8.4
        env:
          # No root password, and that is about the authentication handshake
          # rather than about convenience.
          #
          # MySQL 8.4 authenticates with `caching_sha2_password`, which on a
          # *first* connection over plain TCP has to fetch the server's RSA
          # public key to encrypt the password with. Bun's MySQL client refuses
          # that exchange on an unencrypted connection - correctly, since it is
          # trivially interceptable - so every job began failing at `Migrate`
          # with "The server requested RSA public key retrieval to complete
          # authentication". Nothing in this repository changed; the `mysql:8.4`
          # tag moved.
          #
          # An empty password removes the exchange: there is nothing to encrypt,
          # so the handshake completes without a key. That is safe here for the
          # same reason `postgres/postgres` below is: a container on the
          # runner's loopback that exists for six minutes. It is not advice for
          # a real server - see "MySQL over TCP" in docs/self-hosting.md, which
          # is about TLS.
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: reviewos
        ports:
          - 3306:3306
        # Without a health check the job races the server's first boot, which
        # takes tens of seconds on a cold image - and the failure reads as a
        # connection refused from the application rather than as a service that
        # was not up.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # This application runs on Postgres, and the end-to-end suite needs a
      # real one: it boots the router, creates a repository, and drives a real
      # git client through clone and push. Without it that suite skips itself
      # and the only thing anybody would find out is that it skipped.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Search, for the same reason as Postgres above and with a worse history.
      #
      # The three search files under tests/e2e gate on a reachable node, and
      # every test in them opens with `if (!available) return` - so with no
      # node they did not skip, they *passed*, all twenty-three of them, empty.
      # Three are the check on whether a private repository leaks into somebody
      # else's search results. That is the shape of coverage nobody can see is
      # gone, and it was gone in CI for as long as this file has existed.
      #
      # Pinned to the version `deps.yaml` installs, so CI and a developer's
      # pantry run the same engine.
      #
      # Configured entirely through the environment, because a service
      # container cannot override an image's command the way `compose.yaml`
      # does - its `--data-dir` and `--api-key` arguments are not available
      # here. Checked against the pantry build of this same version rather
      # than assumed: `typesense-server` with no arguments reads both of these
      # and serves `/health`.
      #
      # `/tmp` rather than a directory of its own, and that is the one line
      # here that is not cosmetic. Typesense *refuses to start* when its data
      # directory does not exist - "Data directory ... does not exist", exit
      # before listening - and nothing creates one inside a service container.
      #
      # 8108, the engine's own default, and not the 8208 that `config/deps.ts`
      # and `.env.example` name. That port exists so two projects on one
      # developer's machine do not fight over a port and a peering port; a
      # runner holds one project and there is nothing here to collide with.
      search:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: ci-typesense-key-not-a-real-one
        ports:
          - 8108:8108

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The schema the end-to-end suite reads and writes. `buddy migrate` applies
      # the committed corpus, which is the same thing a real deploy does - so a
      # migration that cannot apply from empty fails here rather than on
      # somebody's server.
      # The corpus each dialect has, applied from empty.
      #
      # `DB_MIGRATIONS_PATH` is absolute, deliberately: passed the relative
      # default the resolver ignores it and picks a directory from which
      # snapshots exist, which is how a Postgres run once wrote into an empty
      # `database/migrations/postgres` and orphaned everything already applied.
      - name: Migrate
        env:
          DB_CONNECTION: ${{ matrix.dialect }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.dialect == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: reviewos
          DB_USERNAME: ${{ matrix.dialect == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: ${{ matrix.dialect == 'postgres' && 'postgres' || '' }}
        run: |
          if [ "${{ matrix.dialect }}" = mysql ]; then
            export DB_MIGRATIONS_PATH="$PWD/database/migrations/mysql"
          else
            export DB_MIGRATIONS_PATH="$PWD/database/migrations"
          fi
          ./buddy migrate

      # Is the search node up before anything asks it a question?
      #
      # On the runner with curl, rather than as a `--health-cmd` on the service
      # above: a health check runs *inside* the service image, and what that
      # image ships is not something this repository can verify, while curl on
      # `ubuntu-latest` is a given. GitHub starts the steps immediately for a
      # service that declares no health check, so without this the suite races
      # Typesense's first boot and the search files fail on a refused
      # connection - which would read exactly like the service being broken.
      - name: Wait for the search node
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -m 2 http://127.0.0.1:8108/health | grep -q '"ok":true'; then
              echo "search node answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::no search node on 127.0.0.1:8108 after 30s; the search suites need one and no longer skip without it"
          docker logs "${{ job.services.search.id }}" 2>&1 | tail -40 || true
          exit 1

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
          DB_CONNECTION: ${{ matrix.dialect }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.dialect == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: reviewos
          DB_USERNAME: ${{ matrix.dialect == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: ${{ matrix.dialect == 'postgres' && 'postgres' || '' }}
          # Where the engine-migration suite finds the *other* engine. It copies
          # Postgres to MySQL and verifies the copy, so it needs both whichever
          # dialect this job is running as.
          DB_MYSQL_HOST: 127.0.0.1
          DB_MYSQL_PORT: '3306'
          DB_MYSQL_USERNAME: root
          DB_MYSQL_PASSWORD: ''
          # The hook posts back to the application, and the endpoint does not
          # exist without a secret. Any value will do; it never leaves the
          # runner.
          GIT_HOOK_SECRET: ci-hook-secret-not-a-real-one
          # The rest of this block exists because CI has no `.env` at all.
          #
          # Every value the suite needs and does not set for itself therefore
          # falls back to a config default, and the defaults are chosen for a
          # fresh install rather than for a test run. Where a developer's
          # `.env` happened to supply the right answer the suite passed on
          # laptops and failed here, which is the worst shape a test can take:
          # green where it is read, red where it gates the deploy.
          #
          # An https origin, because `cloneUrl` is built from `APP_URL` and
          # defaults to `http://localhost`. `view-components` asserts on the
          # rendered clone box, and asserting `https://` against an http
          # instance failed on a page that had rendered perfectly.
          APP_URL: https://reviewos.test
          # Which framework default route bundles mount, and it has to be said
          # here because CI has no `.env` to say it in.
          #
          # This instance takes none of them - see `STACKS_DEFAULT_ROUTES` in
          # `.env.example` for why - and the committed OpenAPI document is
          # generated against that surface. Unset, the default is `all`, so CI
          # mounted 269 routes the document does not describe and
          # `openapi-coverage.test.ts` failed on every one of them. The fix is
          # not to regenerate the document: a document describing routes this
          # instance does not serve is worse than a failing test.
          STACKS_DEFAULT_ROUTES: none
          # The search node above.
          #
          # `config/search-engine.ts` falls back to 127.0.0.1:8108 for the
          # host, port and protocol, so only the key strictly has to be here -
          # that one deliberately has no default, because "a search node
          # reachable with a guessable key answers anybody's query about
          # private repositories". All four are written out anyway: a default
          # that happens to be right is the thing that made the rest of this
          # block necessary.
          TYPESENSE_HOST: 127.0.0.1
          TYPESENSE_PORT: '8108'
          TYPESENSE_PROTOCOL: http
          TYPESENSE_API_KEY: ci-typesense-key-not-a-real-one
          # A mail driver that cannot deliver, which is what the digest suite
          # says it assumes: "there is no mail server in the test environment,
          # so this is the failure path by construction". It was not by
          # construction - it was `MAIL_MAILER=smtp` in a developer's `.env`
          # pointing at a mailpit that does not resolve. Without one, the
          # default is `log`, every send "succeeds", and the three tests
          # pinning "a failed send holds the rows rather than marking them
          # sent" assert against a success.
          MAIL_MAILER: smtp
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: '1'
          # Required application config, not a test setting. Everything that
          # signs or encrypts reads it, and `generateVerificationToken` is the
          # *first* statement in `sendVerificationEmail` - so without a key it
          # throws before the `email_verifications` row is written, the action
          # swallows the error by design (a down mail transport is not the
          # reader's problem), and the endpoint answers 200 having done
          # nothing. The test asserting "the row is the evidence" was right and
          # the environment was wrong. Not a real key; it never leaves the
          # runner.
          APP_KEY: base64:Zm9yLWNpLW9ubHktbm90LWEtcmVhbC1hcHAta2V5LXg9
        run: bun run test

      # `bun run test` shells out to `buddy test`, which only globs
      # <project>/tests/**, so nothing under storage/framework/core/**/tests
      # has ever run in CI. The database bootstrap gates every `buddy migrate`
      # on every server-backed project, so its suite runs explicitly here.
      # Scoped to one file on purpose: wiring up the core suites wholesale
      # needs the pre-existing failures in them triaged first.
      # Only meaningful on the vendored layout. `buddy new` produces a
      # core-less app by default, which resolves the framework from npm and has
      # no storage/framework/core to test - the suites live in the framework's
      # own repository and run there.
      - name: Database bootstrap tests
        run: |
          if [ ! -d storage/framework/core ]; then
            echo "::notice::Database bootstrap tests: this app resolves the framework from npm and has no vendored storage/framework/core; skipping."
            exit 0
          fi
          bun test storage/framework/core/database/tests/ensure-database.test.ts
          bun test storage/framework/core/buddy/tests/database-preflight.test.ts
          bun test storage/framework/core/database/tests/committed-migrations-dialect.test.ts
          bun test storage/framework/core/database/tests/model-sources.test.ts

  # The five tests that need a booted guest, and the only ones in this suite
  # that were passing without asserting anything.
  #
  # Its own job rather than steps in `test` above, for two reasons. It installs
  # a hypervisor and rewrites a udev rule, which is a lot of machinery to put on
  # the critical path of 6,569 tests that do not need it; and it is new, so a
  # failure here should be legible as "the microVM plane broke" rather than as
  # the whole suite going red.
  #
  # x86_64 only, which is not a preference: GitHub's nested virtualization needs
  # the extensions on the host and has them on x86_64 alone. The design was
  # built and verified on aarch64, so this is the first time these two tests run
  # on the other architecture at all.
  microvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # `/dev/kvm` is present on these runners and owned by root, so a test
      # checking `existsSync('/dev/kvm')` sees it and Firecracker then cannot
      # open it. GitHub's own changelog for shipping nested virtualization to
      # the 2-vCPU runners gives this rule as the step that hands it over.
      - name: Hand /dev/kvm to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # nftables because `microvmSupervisor.ts` loads the egress ruleset with
      # `nft -f -` before the machine boots, deliberately in that order: "a
      # guest that boots into an unfiltered network and is filtered a moment
      # later has had a moment of unfiltered network".
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables

      # Pinned and checked, like everything else the guest plane downloads.
      - name: Install Firecracker
        env:
          FIRECRACKER_VERSION: v1.17.0
          FIRECRACKER_SHA256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
        run: |
          curl -fsSL -o /tmp/firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-x86_64.tgz"
          echo "${FIRECRACKER_SHA256}  /tmp/firecracker.tgz" | sha256sum -c -
          tar xzf /tmp/firecracker.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FIRECRACKER_VERSION}-x86_64/firecracker-${FIRECRACKER_VERSION}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      # Built once, and the four paths and digests carried to the next step
      # through the environment file rather than by running the build again.
      # `--env` emits `export` lines for a shell; `$GITHUB_ENV` wants them bare.
      - name: Build the guest kernel and image
        run: ./scripts/microvm/build-guest.sh --env | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Egress suite
        env:
          APP_URL: https://reviewos.test
          APP_KEY: base64:Zm9yLWNpLW9ubHktbm90LWEtcmVhbC1hcHAta2V5LXg9
          STACKS_DEFAULT_ROUTES: none
          # Where the supervisor writes a job's payload disk and its machine
          # configuration. The default is `/var/lib/reviewos/microvm`, which is
          # right for a deployed runner and is not a directory a GitHub runner
          # has - so every probe failed before booting anything, with the disk
          # it could not create as the reason.
          REVIEWOS_MICROVM_SCRATCH: ${{ runner.temp }}/microvm
        run: |
          mkdir -p "${{ runner.temp }}/microvm"
          bun test tests/e2e/microvm-egress.test.ts

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Is there anything here to compile?
      #
      # The compile step below already answered this and skipped, but only
      # after the two expensive setup steps had run to prepare for it. One of
      # them, `pantry install`, is what has been failing: `pantry.lock` is
      # generated on a developer's machine, so it pins versions that resolve on
      # darwin and omits the linux-only transitive dependencies entirely -
      # `openldap.org@2.6.13` and `util-linux@2.41.3` came back VersionNotFound
      # on the runner. So the job was installing a system package tree, on the
      # critical path to every deploy, in order to skip the one step that tree
      # was for.
      #
      # Asked once here instead. A vendored core flips every step below back
      # on, which is the layout this job was written for; a core-less app - the
      # default, and what this one is - now says so and stops.
      - name: Is the framework vendored here
        id: vendored
        run: |
          if [ -d storage/framework/core ]; then
            echo 'yes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'yes=false' >> "$GITHUB_OUTPUT"
            echo '::notice::compile: this app resolves the framework from npm and has no vendored storage/framework/core; nothing to compile.'
          fi

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The release job resolves through `pantry/`, not `node_modules`, and the
      # two lockfiles pin different versions — the first attempt at this check
      # passed here while the release still failed on a package `pantry.lock`
      # held back. So this installs the same tree the release does.
      - name: Install the pantry tree
        if: steps.vendored.outputs.yes == 'true'
        run: pantry install

      # The binaries are built only by the release job, on a tag, after npm
      # publish. So a dependency that grows a top-level await — which
      # `bun build --compile` refuses to bundle through a `require()` — took
      # three releases to notice: the packages published, the compile failed,
      # and nobody looked. One target here is enough to catch that, and it is
      # the cheap half of `compile:all`.
      # See above: nothing to compile when the framework comes from npm.
      - name: Compile the buddy binary
        if: steps.vendored.outputs.yes == 'true'
        run: |
          cd storage/framework/core/buddy
          bun run compile:linux-x64

  deployment-target:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      flag: ${{ steps.target.outputs.flag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      # `--config=/dev/null`, so the application's preloader does not run.
      #
      # This job installs nothing, deliberately: the script imports `node:fs`
      # and nothing else, and installing the whole tree to read a ref and print
      # a name would cost minutes on the critical path to every deploy. But
      # `bunfig.toml` preloads `storage/framework/defaults/resources/plugins/preloader.ts`
      # for *every* `bun` invocation in this directory, and that needs
      # `@stacksjs/path` from `node_modules` - so the job failed with an ENOENT
      # about a package the script never asked for, and passed only when an
      # `actions/cache` hit happened to leave `node_modules` lying around. A
      # job that works or not depending on a cache is a job that will fail on
      # the day it matters.
      #
      # An empty config gives a dependency-free script a dependency-free
      # runtime, which is what it always was.
      - name: Resolve provisioned deployment target
        id: target
        run: bun --config=/dev/null .github/scripts/deploy/resolve-target.ts --ref "$GITHUB_REF" --github-output "$GITHUB_OUTPUT"

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, typecheck, test, compile, deployment-target]
    # The same lock `deploy.yml` holds, because there are two ways to deploy
    # this instance and they were not aware of each other: the workflow-level
    # group here is `ci-<ref>`, so a push's deploy job and a manual deploy could
    # run at the same time and the one that finished last won. That is not
    # theoretical - the box spent an evening serving a release three commits
    # behind `main` because an earlier push's CI deploy landed after a manual
    # deploy of a newer commit, and nothing anywhere said so.
    #
    # Serialising them does not order them: a queued deploy of an older commit
    # still ships an older commit when its turn comes. What it stops is two
    # deploys switching the release symlink underneath each other.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.deployment-target.outputs.environment }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.deployment-target.outputs.environment }}
      DEPLOY_FLAG: ${{ needs.deployment-target.outputs.flag }}

    steps:
      # Every required secret, checked once, before anything is installed.
      #
      # Split across the steps that used each one, a run reported the first
      # missing secret and stopped - so filling them in took one run per
      # secret, each a couple of minutes, each ending in a different error.
      # One list up front names all of them at once.
      #
      # Lengths only, never values: safe to print, and enough to tell absent
      # from wrong. GitHub does not report a missing secret - it substitutes an
      # empty string and lets the job run on.
      - name: Check deploy secrets
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=''
          for name in HCLOUD_TOKEN APP_KEY DB_PASSWORD DEPLOY_SSH_KEY; do
            eval "value=\${$name:-}"
            if [ -n "$value" ]; then
              echo "$name: present (${#value} chars)"
            else
              echo "$name: EMPTY"
              missing="$missing $name"
            fi
          done

          for name in PORKBUN_API_KEY PORKBUN_SECRET_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || echo "::notice::$name is not set; DNS reconciliation will be skipped."
          done

          # Not required, and worth saying out loud every time it is absent.
          #
          # Without it the mirrors read GitHub unauthenticated at sixty requests
          # an hour, so descriptions, topics and issues import slowly or not at
          # all. This deploy used to ship secrets.GITHUB_TOKEN instead, which
          # is revoked the moment the job ends - every metadata sync answered
          # 401 and the instance had 151 mirrored repositories and not one
          # description.
          if [ -z "${MIRROR_GITHUB_TOKEN:-}" ]; then
            echo "::warning::MIRROR_GITHUB_TOKEN is not set; mirrors will read GitHub unauthenticated (60 requests an hour), so descriptions and issues import slowly. Set a PAT with public read: gh secret set MIRROR_GITHUB_TOKEN --repo ${{ github.repository }}"
          else
            echo "MIRROR_GITHUB_TOKEN: present (${#MIRROR_GITHUB_TOKEN} chars)"
          fi

          [ -z "$missing" ] || {
            echo "::error::Empty repository secrets:$missing"
            echo "Set each with --body, not a redirect from a process substitution -"
            echo "that form reports success and stores nothing:"
            for name in $missing; do
              if [ "$name" = DEPLOY_SSH_KEY ]; then
                echo "  gh secret set DEPLOY_SSH_KEY --repo ${{ github.repository }} < ~/.ssh/reviewos-deploy"
              else
                echo "  gh secret set $name --repo ${{ github.repository }} --body \"\$(grep '^$name=' .env | cut -d= -f2-)\""
              fi
            done
            exit 1
          }

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Deploy SSH Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Deploy ${{ env.DEPLOY_ENVIRONMENT }}
        env:
          APP_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
          # Named HCLOUD_TOKEN because that is what the Hetzner driver falls
          # back to; see config/cloud.ts.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          # A real credential, not the workflow's own.
          #
          # This said `secrets.GITHUB_TOKEN`, which is the Actions
          # *installation* token: it starts `ghs_`, it is scoped to this
          # repository, and **GitHub revokes it the moment the job ends**.
          # The deploy wrote it into the release .env, the mirrors read it
          # hours later, and every metadata sync came back `GitHub returned
          # 401` - so no mirrored repository ever got a description, a topic
          # or an issue, while the code fetched perfectly.
          #
          # MIRROR_GITHUB_TOKEN is a PAT with public read (or a GitHub App
          # installation token minted at deploy time). Absent, the mirrors
          # run unauthenticated at sixty requests an hour, which imports a
          # small instance slowly and is strictly better than a token that is
          # dead on arrival.
          GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          COPYFILE_DISABLE: '1'
        run: |
          set -euo pipefail

          # Write the .env the app expects.
          #
          # `buddy deploy` reads process.env, but the Stacks env layer loads
          # `.env` first and what it finds there wins - so on a runner with no
          # `.env` the exported secrets were overwritten with nothing and the
          # deploy stopped with "No Hetzner API token found" while the token was
          # sitting right there in the environment.
          #
          # DB_PASSWORD matters as much as the token: config/cloud.ts passes it
          # into the release env, and deploying without it points production at
          # its database with an empty password and fails at migrate.
          umask 077
          {
            printf 'APP_ENV=%s\n' "${APP_ENV:-production}"
            printf 'HCLOUD_TOKEN=%s\n' "${HCLOUD_TOKEN:-}"
            printf 'APP_KEY=%s\n' "${APP_KEY:-}"
            printf 'DB_PASSWORD=%s\n' "${DB_PASSWORD:-}"
            printf 'PORKBUN_API_KEY=%s\n' "${PORKBUN_API_KEY:-}"
            printf 'PORKBUN_SECRET_KEY=%s\n' "${PORKBUN_SECRET_KEY:-}"
          } > .env

          for required in HCLOUD_TOKEN DB_PASSWORD; do
            eval "value=\${$required:-}"
            [ -n "$value" ] || echo "::warning::$required is not set; the deploy will not get far."
          done

          # Every site this project declares, which is now more than one.
          #
          # This was `--site reviewos`, and `--site` takes exactly one name:
          # once the API became its own service, that flag was the difference
          # between deploying it and not. The scoping was there because
          # config/cloud.ts used to carry the template's stacks sites -
          # stacksjs.com, its docs, blog and redirects - and an unscoped deploy
          # died in the blog's build step reaching for a vendored
          # `storage/framework/core` a core-less app does not have. Those sites
          # are gone; the config declares `reviewos` and `api` and nothing else,
          # so the scoping now only excludes half of this project.
          ./buddy deploy "$DEPLOY_FLAG" --yes

      - name: Verify the deploy answers
        # This job had no verification at all, and `deploy.yml` - the manual
        # path nobody uses - had the only one. So the deploy that actually runs
        # went green on `buddy deploy` exiting 0, whatever the box was serving
        # afterwards.
        #
        # Both halves, because they are different processes: `/` is the page
        # server and `/api/health` is the API. Checking only the first is how
        # the entire API surface answered 502 for as long as it did while every
        # deploy reported success.
        if: env.DEPLOY_ENVIRONMENT == 'production'
        run: |
          set -euo pipefail
          check() {
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000)
              if [ "$code" = "200" ]; then
                echo "$1 responded 200"
                return 0
              fi
              echo "attempt $attempt: $1 -> $code"
              sleep 15
            done
            echo "$1 did not return 200 after the deploy" >&2
            return 1
          }
          check https://reviewos.org/
          check https://reviewos.org/api/health

  publish-commit:
    if: github.event_name == 'pull_request'
    needs: [lint, typecheck, test, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      # Before install, not after: a lockfile CI's Bun cannot parse kills
      # `bun install` itself, so a check that runs afterwards never gets to
      # speak. Shell rather than the TypeScript version for the same reason -
      # anything invoking `bun` here hits the bunfig preload before
      # node_modules exists.
      - name: Check lockfile version
        run: |
          version=$(sed -n 's/.*"lockfileVersion"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' bun.lock | head -1)
          if [ "$version" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion $version but CI's Bun reads 1. Regenerate with the pinned Bun: ./pantry/.bin/bun install --lockfile-only"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
