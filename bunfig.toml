# preload these modules before running bun.
#
# Order matters:
#   1. env plugin auto-loads `.env` and decrypts dotenvx-style encrypted
#      values (stacksjs/stacks#1053) so the rest of the boot chain — config
#      loader, preloader, user routes — reads plaintext from process.env.
#   2. main preloader wires auto-imports + framework plugins; safe to run
#      after the env layer because it can now read decrypted secrets too.
preload = [
  "@stacksjs/env/plugin.js",
  "./storage/framework/defaults/resources/plugins/preloader.ts",
]

[test]
# Look for tests where the tests are.
#
# Without this, `bun test` walks the whole project looking for test files -
# including `pantry/`, which is a package tree of hundreds of thousands of
# files. It follows the symlinks it finds there, and once a few hundred have
# been opened the process runs out of file descriptors: the next `spawn` fails
# with `EBADF`, and every test that shells out to git fails with it. The
# reproduction is one directory of 800 symlinks anywhere under the project
# root, and it does not need to be imported by anything.
#
# `bun run` is unaffected - it resolves modules rather than scanning for files -
# which is why the application works while the suite does not.
root = "tests"

# Tests also get the env layer so encrypted .env values resolve during the
# suite — match production boot semantics rather than papering over a
# different decrypt path in test-only code.
preload = [
  "@stacksjs/env/plugin.js",
  "./tests/setup.ts",
]
coverage = false

[run]
# equivalent to `bun --bun` for all `bun run` commands
bun = true

[serve.static]
plugins = [ "bun-plugin-stx" ]

[install]
registry = { url = "https://registry.npmjs.org/", token = "$BUN_AUTH_TOKEN" }
linker = "hoisted"
