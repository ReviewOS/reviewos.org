# Auto-generated from config/deps.ts and .env sniffing.
# This file is regenerated on each `buddy setup` run.
#
# To learn more, please visit:
# https://stacksjs.com/docs/dependency-management

dependencies:
  bun: ^1.3.14
  git: ^2.47.0
  gnupg.org: ^2.4.8
  openssh.com: ^9.9.0
  git-lfs: ^3.7.1
  typesense.org: ^30.2.0
  valkey.io: ^8.1.8
  postgresql.org: ^17.10

services:
  enabled: true
  autoStart:
    - postgres
    - typesense
  define:
    app:
      command: ./buddy serve
      port: 3000
      health: curl -sf http://127.0.0.1:3000/api/health
    worker:
      command: ./buddy queue:work --concurrency 4
    scheduler:
      command: ./buddy schedule:run
