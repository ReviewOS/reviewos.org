# A whole ReviewOS instance, on one host.
#
# **The canonical deployment is pantry, not this file.** `./buddy setup` with
# pantry installs every system dependency and runs every service directly on
# the box, which is how docs/self-hosting.md tells you to deploy. This compose
# file is the convenience path for people who already run everything in
# containers - kept at parity with the real configuration, but demoted: when
# the two disagree, pantry is right and this file has a bug.
#
# One host is what most instances will be, and this is the shape of it: the
# application, a queue worker, Postgres, and a search engine. Four containers,
# two volumes, and nothing that needs a cluster.
#
#   docker compose up -d
#   docker compose exec app bun run --bun ./buddy migrate
#
# Read docs/self-hosting.md before running this in anger. The two things that
# matter most are not in this file: the secrets, which belong in `.env`, and the
# backup, which has to take Postgres and the repositories from the same moment.

services:
  app:
    build: .
    restart: unless-stopped
    # `env_file` rather than inline `environment`, so no secret is ever written
    # into a file that gets committed. This one is gitignored.
    env_file: .env
    environment:
      # Overrides for the container's view of the world. The service names are
      # the hostnames inside the compose network, and a `.env` written for a
      # local run will say `127.0.0.1` for both. These are the variables
      # `config/search-engine.ts` actually reads - this file shipped a
      # `SEARCH_HOST` nothing read, and a Meilisearch nothing spoke to, for
      # months.
      DB_HOST: database
      DB_PORT: '3306'
      TYPESENSE_HOST: search
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
    ports:
      - '3000:3000'
    volumes:
      # The two paths that hold state. Everything else in the image is
      # reproducible from the source, and these two are not: the first holds
      # every repository, the second every upload.
      - repos:/app/storage/repos
      - uploads:/app/storage/app
    depends_on:
      database:
        # Not merely started. A container that is running is not a database that
        # is accepting connections, and the difference is a crash loop on every
        # `docker compose up` while the server finishes its first-run
        # initialisation.
        condition: service_healthy

  # The queue as its own process, and its own container.
  #
  # Separate because the two fail differently and scale differently: a job that
  # wedges a worker should not stop anybody reading a diff, and an instance with
  # heavy mirroring wants more workers without more web processes.
  #
  # Concurrency is 4. Most jobs here are a git process or an outbound HTTP
  # request - waiting, rather than computing - so the useful number is higher
  # than the core count and is bounded by what the disk and the remote will
  # take. Raise it if the queue depth in `/api/health` stays above zero; lower
  # it if the host's load average climbs while nothing is being served.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: '3306'
      TYPESENSE_HOST: search
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
    command: ['bun', 'run', '--bun', './buddy', 'queue:work', '--concurrency', '4']
    volumes:
      # The same repositories. A worker that fetches a mirror or computes a
      # merge writes to exactly the disk the web process reads from, and pointing
      # them at two volumes is a bug that looks like missing data.
      - repos:/app/storage/repos
      - uploads:/app/storage/app
    depends_on:
      database:
        condition: service_healthy

  # Search. Typesense, because that is what `config/search-engine.ts` declares
  # and what the indexing trait speaks - this service was Meilisearch until
  # 2026-08, so a compose deployment had a search container the application
  # never talked to and an empty search page.
  #
  # Optional in the sense that the rest of the instance works without it - a
  # repository you cannot search is still a repository you can clone - but the
  # search page is empty until this is up and indexed.
  search:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command: ['--data-dir', '/data', '--api-key', '${TYPESENSE_API_KEY:-please-change-me}']
    volumes:
      - search:/data

  # The metadata database. MySQL from phase 17; an instance still on Postgres
  # keeps working, and `buddy db:migrate-engine` is how it moves.
  #
  # utf8mb4 is named rather than inherited: a server left on latin1 accepts the
  # schema and then rejects the first four-byte character - an emoji in a
  # comment, a name outside the BMP - years later.
  database:
    image: mysql:8.4
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reviewos}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-reviewos}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      # What `depends_on: service_healthy` above waits for. Named host, because
      # `mysqladmin ping` with none goes to its compiled-in socket and reports
      # the server up before it is listening on the port.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD:-reviewos} --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  # Named, not bind mounts, so a `docker compose down` does not take them with
  # it. `down -v` still does, which is the one command to be careful with.
  repos:
  uploads:
  database:
  search:
